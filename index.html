<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弦外之音 · 中华传统乐器人格测试</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@font-face{font-family:'Ma Shan Zheng';src:url('fonts/MaShanZheng.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'ZCOOL XiaoWei';src:url('fonts/ZCOOLXiaoWei.ttf') format('truetype');font-weight:400;font-display:swap}
:root{--paper:#f7f3eb;--paper-dark:#ede6d8;--ink:#2c2416;--ink-light:#5c5240;--ink-faint:#8a8070;--red-seal:#c23a2b;--gold:#b8934a;--gold-light:#d4af6b;--border:#7a5a32;--token-bg:#f5edd8;--font-calligraphy:'ZCOOL XiaoWei','Ma Shan Zheng',serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Serif SC','SimSun','STSong',serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.8}
.ink-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.home-bg{position:fixed;inset:0;z-index:-2;background-image:url('bg-home.png');background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity 0.5s}
.quiz-bg{position:fixed;inset:0;z-index:-2;background-image:url('bg-quiz.png');background-size:cover;background-position:center;background-repeat:no-repeat}
body.on-home .quiz-bg{opacity:0;pointer-events:none}
body:not(.on-home) .home-bg{opacity:0;pointer-events:none}
body:not(.on-home) .quiz-bg{opacity:1}
body.on-home .home-bg{opacity:1}
.ink-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.06;animation:inkDrift 20s ease-in-out infinite}
.ink-blob:nth-child(1){width:600px;height:400px;background:#2c2416;top:-10%;left:-10%;animation-delay:0s}
.ink-blob:nth-child(2){width:500px;height:350px;background:#5c4a3a;bottom:-15%;right:-8%;animation-delay:-7s}
.ink-blob:nth-child(3){width:400px;height:500px;background:#3a2c1e;top:40%;left:50%;animation-delay:-14s}
.ink-blob:nth-child(4){width:300px;height:300px;background:#c23a2b;top:20%;right:20%;opacity:0.03;animation-delay:-3s}
.ink-blob:nth-child(5){width:450px;height:300px;background:#4a7c59;bottom:30%;left:15%;opacity:0.04;animation-delay:-10s}
@keyframes inkDrift{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.08)}50%{transform:translate(-15px,25px) scale(0.94)}75%{transform:translate(20px,10px) scale(1.05)}}
.paper-texture{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0.4;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(139,119,90,0.03) 2px,rgba(139,119,90,0.03) 4px),repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(139,119,90,0.02) 3px,rgba(139,119,90,0.02) 6px)}
.app-container{max-width:960px;margin:0 auto;padding:24px 20px 60px;min-height:100vh;display:flex;flex-direction:column}
.page{display:none;flex:1}
.page.active{display:block;animation:fadeSlideIn 0.6s ease-out}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#page-home .hero{background:rgba(245,237,216,0);border-radius:16px;padding:20px 24px 20px;text-align:center;position:relative;overflow:visible}
.hero-seal-wrapper{position:relative;display:inline-block;width:clamp(110px,18vw,170px);height:clamp(110px,18vw,170px);margin-bottom:20px}
.hero-seal{width:100%;height:100%;object-fit:contain;opacity:0;animation:fadeIn 1s ease-out 0.2s forwards}
.cloud{position:absolute;border-radius:50%;filter:blur(6px);opacity:0;animation:cloudFloat 6s ease-in-out infinite}
.cloud-1{width:60px;height:30px;background:radial-gradient(ellipse at center,#d4af6b 0%,transparent 70%);top:-10px;left:-30px;animation-delay:0s}
.cloud-2{width:50px;height:25px;background:radial-gradient(ellipse at center,#c23a2b 0%,transparent 70%);top:-5px;right:-25px;animation-delay:-1.5s}
.cloud-3{width:70px;height:35px;background:radial-gradient(ellipse at center,#d4af6b 0%,transparent 70%);bottom:-5px;left:-35px;animation-delay:-3s}
.cloud-4{width:55px;height:28px;background:radial-gradient(ellipse at center,#c23a2b 0%,transparent 70%);bottom:-8px;right:-30px;animation-delay:-4.5s}
.cloud-5{width:40px;height:20px;background:radial-gradient(ellipse at center,#d4af6b 0%,transparent 70%);top:50%;left:-40px;animation-delay:-2s}
.cloud-6{width:45px;height:22px;background:radial-gradient(ellipse at center,#c23a2b 0%,transparent 70%);top:50%;right:-38px;animation-delay:-5s}
@keyframes cloudFloat{0%,100%{opacity:0;transform:translate(0,0) scale(1)}20%{opacity:0.7;transform:translate(-5px,-8px) scale(1.1)}50%{opacity:0.5;transform:translate(-12px,-15px) scale(1.05)}80%{opacity:0.7;transform:translate(-5px,-8px) scale(1.1)}}
@keyframes fadeIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
.hero-title{font-family:var(--font-calligraphy);font-size:clamp(40px,7vw,64px);font-weight:400;letter-spacing:0.15em;color:var(--ink);margin-bottom:12px;opacity:0;animation:fadeSlideIn 0.8s ease-out 0.4s forwards}
.hero-subtitle{font-family:var(--font-calligraphy);font-size:16px;color:var(--ink-light);letter-spacing:0.15em;opacity:0;animation:fadeSlideIn 0.8s ease-out 0.6s forwards}
.pattern-divider{width:100%;height:24px;background:repeating-linear-gradient(90deg,transparent 0px,transparent 8px,var(--ink-faint) 8px,var(--ink-faint) 10px,transparent 10px,transparent 16px,var(--ink-faint) 16px,var(--ink-faint) 18px,transparent 18px,transparent 24px);opacity:0.25;margin:32px 0;background-color:rgba(247,243,235,0.6)}
.tokens-section{padding:30px 0 20px}
#page-home .tokens-section{background:rgba(245,237,216,0.65);padding:30px 16px 20px}
.tokens-grid{display:flex;justify-content:center;gap:clamp(10px,2vw,20px);flex-wrap:wrap}
.token{width:clamp(130px,18vw,170px);height:clamp(200px,28vw,260px);perspective:800px;cursor:pointer;display:block;opacity:0;transform:translateY(30px);transition:opacity 0.5s,transform 0.5s}
.token.visible{opacity:1;transform:translateY(0)}
.token-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1)}
.token:hover .token-card{transform:rotateY(180deg)}
.token-front,.token-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;border:2px solid var(--border);box-shadow:0 4px 12px rgba(44,36,22,0.12)}
.token-front{background:var(--token-bg);display:flex;flex-direction:column}
.token-front-img{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
.token-front-img img{width:100%;height:100%;object-fit:contain}
.token-front-label{padding:10px 8px 8px;text-align:center;background:linear-gradient(to bottom,rgba(245,237,216,0),rgba(245,237,216,0.95))}
.token-front-name{font-family:'ZCOOL XiaoWei',serif;font-size:clamp(18px,2.5vw,22px);font-weight:700;color:var(--ink);letter-spacing:0.12em}
.token-front-tag{font-size:11px;color:var(--ink-faint);letter-spacing:0.06em;margin-top:2px}
.token-back{background:var(--token-bg);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:8px}
.token-back-name{font-family:'ZCOOL XiaoWei',serif;font-size:clamp(20px,3vw,28px);font-weight:700;color:var(--ink);letter-spacing:0.15em;text-align:center}
.token-back-hint{font-size:11px;color:var(--ink-faint);letter-spacing:0.05em;text-align:center}
#page-home .intro-quote{background:rgba(245,237,216,0.7);padding:24px 20px}
.intro-quote{text-align:center;padding:24px 20px;font-size:15px;color:var(--ink-light);letter-spacing:0.05em;line-height:2;position:relative}
.intro-quote::before,.intro-quote::after{content:'';display:block;width:40px;height:2px;background:var(--ink-faint);margin:16px auto;opacity:0.3}
.intro-section{text-align:center;padding:0 20px 8px}
.intro-slogan{font-family:var(--font-calligraphy);font-size:clamp(22px,4vw,34px);color:var(--ink);letter-spacing:0.18em;margin-bottom:18px;opacity:0;animation:fadeSlideIn 0.8s ease-out 0.8s forwards}
.intro-desc{font-size:15px;color:var(--ink-light);line-height:2.2;letter-spacing:0.04em;max-width:540px;margin:0 auto 20px;opacity:0;animation:fadeSlideIn 0.8s ease-out 1s forwards}
.intro-divider-row{display:flex;align-items:center;gap:16px;max-width:480px;margin:0 auto 20px;opacity:0;animation:fadeSlideIn 0.8s ease-out 1.1s forwards}
.intro-divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ink-faint),transparent);opacity:0.4}
.intro-divider-icon{font-size:16px;color:var(--ink-faint);opacity:0.5}
#page-home .btn-start-wrapper{background:rgba(245,237,216,0.6);padding:10px 0 40px}
.btn-start-wrapper{text-align:center;padding:10px 0 40px}
.btn-start{display:inline-block;padding:16px 48px;font-family:var(--font-calligraphy);font-size:20px;letter-spacing:0.1em;color:var(--paper);background:linear-gradient(135deg,#3d2e1e,#5a4232);border:none;border-radius:40px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.4s;box-shadow:0 6px 20px rgba(44,36,22,0.25);opacity:0;animation:fadeSlideIn 0.8s ease-out 1.3s forwards}
.btn-start::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,0.15);border-radius:50%;transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s}
.btn-start:hover::before{width:400px;height:400px}
.btn-start:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(44,36,22,0.35)}
.btn-start:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(44,36,22,0.3)}
.quiz-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 10px}
.quiz-counter{font-family:var(--font-calligraphy);font-size:18px;color:var(--ink-faint);letter-spacing:0.06em}
.quiz-counter span{color:var(--ink);font-size:24px;font-weight:700}
.quiz-progress{flex:1;height:3px;background:#e0d8c8;border-radius:2px;margin:0 20px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red-seal));border-radius:2px;transition:width 0.5s ease-out}
.btn-back{font-family:'ZCOOL XiaoWei',serif;font-size:14px;color:var(--ink-faint);background:none;border:1px solid #d4c5a0;border-radius:20px;padding:6px 16px;cursor:pointer;transition:all 0.3s}
.btn-back:hover{color:var(--ink);border-color:var(--ink)}
.question-card{background:rgba(253,250,245,0.88);border:1px solid rgba(224,216,200,0.6);border-radius:16px;padding:36px 28px;margin:20px 0;box-shadow:0 4px 20px rgba(44,36,22,0.1);position:relative}
.question-card::before{content:'';position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0.5}
.question-text{font-family:var(--font-calligraphy);font-size:clamp(20px,3vw,26px);font-weight:400;line-height:1.8;color:var(--ink);margin-bottom:32px;text-align:center}
.options-list{display:flex;flex-direction:column;gap:12px}
.option-btn{display:flex;align-items:center;gap:16px;width:100%;padding:16px 20px;background:rgba(250,247,239,0.85);border:1.5px solid rgba(229,220,200,0.7);border-radius:12px;cursor:pointer;font-family:'Noto Serif SC',serif;font-size:15px;color:var(--ink);text-align:left;transition:all 0.3s;position:relative;overflow:hidden}
.option-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(184,147,74,0.06));opacity:0;transition:opacity 0.3s}
.option-btn:hover{border-color:var(--gold);background:#fdf9f0;transform:translateX(4px)}
.option-btn:hover::after{opacity:1}
.option-btn:active{transform:scale(0.985)}
.option-label{width:32px;height:32px;border-radius:50%;border:2px solid #d4c5a0;display:flex;align-items:center;justify-content:center;font-family:'ZCOOL XiaoWei',serif;font-size:14px;color:var(--ink-faint);flex-shrink:0;transition:all 0.3s}
.option-btn:hover .option-label{border-color:var(--gold);color:var(--gold);background:rgba(184,147,74,0.08)}
.audio-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.audio-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px;background:#faf7ef;border:1.5px solid #e5dcc8;border-radius:12px;cursor:pointer;transition:all 0.3s;position:relative}
.audio-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 20px rgba(44,36,22,0.1)}
.audio-card.playing{border-color:var(--gold);background:#fef9ed}
.audio-icon-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1.5px solid #d4c5a0;transition:all 0.3s}
.audio-card:hover .audio-icon-circle{border-color:var(--gold);background:rgba(184,147,74,0.08)}
.audio-icon-circle img{width:100%;height:100%;object-fit:cover}
.audio-instrument-name{font-family:'ZCOOL XiaoWei',serif;font-size:16px;font-weight:600}
.audio-wave{display:flex;align-items:flex-end;gap:2px;height:28px}
.audio-wave-bar{width:3px;background:#d4c5a0;border-radius:2px;transition:all 0.15s}
.audio-card.playing .audio-wave-bar{background:var(--gold)}
.audio-play-btn{width:36px;height:36px;border-radius:50%;border:2px solid #d4c5a0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;font-size:14px}
.audio-card:hover .audio-play-btn{border-color:var(--gold);color:var(--gold)}
.audio-select-text{font-size:12px;color:var(--ink-faint)}
.result-container{max-width:680px;margin:0 auto;width:100%}
.result-card{background:#fdfaf5;border:1px solid #e0d8c8;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(44,36,22,0.1);animation:fadeSlideIn 0.8s ease-out}
.result-header{padding:40px 28px 30px;text-align:center;position:relative;color:#f7f3eb;background-size:cover;background-position:center;background-repeat:no-repeat}
.result-header::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,0.5),rgba(0,0,0,0.3),rgba(0,0,0,0.45));z-index:0}
.result-header > *{position:relative;z-index:1}
.result-instrument-name{font-family:var(--font-calligraphy);font-size:clamp(36px,5vw,52px);font-weight:400;letter-spacing:0.12em}
.result-persona-title{font-size:16px;letter-spacing:0.1em;opacity:0.85;margin-top:4px}
.result-header[data-inst="erhu"]{background-image:url('bg-result-erhu.jpg')}
.result-header[data-inst="pipa"]{background-image:url('bg-result-pipa.jpg')}
.result-header[data-inst="guqin"]{background-image:url('bg-result-guqin.jpg')}
.result-header[data-inst="dizi"]{background-image:url('bg-result-dizi.jpg')}
.result-header[data-inst="guzheng"]{background-image:url('bg-result-guzheng.jpg')}
.result-header[data-inst="suona"]{background-image:url('bg-result-suona.jpg')}
.result-instrument-icon{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);overflow:hidden}
.result-instrument-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.result-instrument-name{font-family:var(--font-calligraphy);font-size:clamp(36px,5vw,52px);font-weight:400;letter-spacing:0.12em}
.result-persona-title{font-size:16px;letter-spacing:0.1em;opacity:0.8;margin-top:4px}
.result-body{padding:32px 28px}
.result-section{margin-bottom:28px;animation:fadeSlideIn 0.6s ease-out forwards}
.result-section:nth-child(1){animation-delay:0.1s}
.result-section:nth-child(2){animation-delay:0.2s}
.result-section:nth-child(3){animation-delay:0.3s}
.result-section:nth-child(4){animation-delay:0.4s}
.result-section:nth-child(5){animation-delay:0.5s}
.result-section:nth-child(6){animation-delay:0.6s}
.result-section:nth-child(7){animation-delay:0.7s}
.result-section:last-child{margin-bottom:0}
.result-section-title{font-family:var(--font-calligraphy);font-size:17px;font-weight:400;color:var(--ink);margin-bottom:12px;padding-left:14px;border-left:3px solid rgba(120,100,80,0.3);letter-spacing:0.12em}
.result-section p{font-size:15px;line-height:2;color:var(--ink-light);text-indent:2em}
.result-section ul{list-style:none;padding-left:14px}
.result-section ul li{font-size:15px;line-height:2;color:var(--ink-light);position:relative;padding-left:20px}
.result-section ul li::before{content:'◆';position:absolute;left:0;font-size:6px;top:12px;color:var(--gold)}
.result-traits{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.trait-tag{padding:6px 16px;background:#f5efe0;border:1px solid #e0d8c8;border-radius:20px;font-size:13px;color:var(--ink-light)}
.trait-tag:first-child{border-color:var(--gold);color:var(--gold)}
.percent-chart{margin:16px 0 0}
.percent-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.percent-label{width:42px;font-size:13px;color:var(--ink-light);text-align:right;flex-shrink:0}
.percent-bar-track{flex:1;height:10px;background:#e8dfcc;border-radius:5px;overflow:hidden}
.percent-bar-fill{height:100%;border-radius:5px;transition:width 1.2s cubic-bezier(0.25,0.46,0.45,0.94)}
.percent-value{width:38px;font-size:12px;color:var(--ink-light);text-align:right;flex-shrink:0}
.hexagon-section{margin:24px 0 0}
.hexagon-chart-wrap{position:relative;width:280px;height:260px;margin:0 auto}
.hexagon-chart-wrap svg{width:100%;height:100%}
.hex-dot{opacity:0}
.hex-label{font-family:var(--font-calligraphy);font-size:11px;fill:var(--ink-faint);letter-spacing:0.05em;text-anchor:middle}
.hex-score-label{font-family:var(--font-calligraphy);font-size:10px;fill:var(--ink-faint);text-anchor:middle;opacity:0.7}
.compat-section{margin:24px 0 0}
.compat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.compat-card{border-radius:12px;padding:16px;position:relative;overflow:hidden}
.compat-best{background:linear-gradient(135deg,rgba(74,124,89,0.08),rgba(74,124,89,0.04));border:1px solid rgba(74,124,89,0.25)}
.compat-worst{background:linear-gradient(135deg,rgba(194,57,42,0.08),rgba(194,57,42,0.04));border:1px solid rgba(194,57,42,0.2)}
.compat-badge{font-size:11px;letter-spacing:0.1em;padding:3px 10px;border-radius:10px;display:inline-block;margin-bottom:10px}
.compat-best .compat-badge{background:rgba(74,124,89,0.15);color:#4a7c59}
.compat-worst .compat-badge{background:rgba(194,57,42,0.12);color:#c23a2b}
.compat-instrument{font-family:var(--font-calligraphy);font-size:22px;letter-spacing:0.1em;margin-bottom:8px}
.compat-reason{font-size:13px;line-height:1.8;color:var(--ink-light)}
.score-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.score-bar-label{width:50px;font-size:13px;color:var(--ink-light);text-align:right;flex-shrink:0}
.score-bar-track{flex:1;height:8px;background:#e8dfcc;border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:4px;transition:width 1s ease-out}
.result-actions{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:0 28px 40px}
.btn-retry,.btn-share{padding:14px 32px;font-family:'ZCOOL XiaoWei',serif;font-size:16px;letter-spacing:0.08em;border-radius:30px;cursor:pointer;transition:all 0.3s}
.btn-retry{background:var(--ink);color:var(--paper);border:none;box-shadow:0 4px 12px rgba(44,36,22,0.2)}
.btn-retry:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(44,36,22,0.3)}
.btn-share{background:none;color:var(--ink-light);border:1.5px solid #d4c5a0}
.btn-share:hover{border-color:var(--ink);color:var(--ink)}
.score-overview{padding:20px 28px;border-top:1px solid #e8dfcc;cursor:pointer;text-align:center;font-size:14px;color:var(--ink-faint);transition:color 0.3s}
.score-overview:hover{color:var(--ink)}
.footer{text-align:center;padding:30px 0;font-size:12px;color:var(--ink-faint);opacity:0.6;letter-spacing:0.05em}
::-webkit-scrollbar{width:6px}

var questions=[{id:1,text:'你最适合以下哪种生活状态？',options:[{label:'A',text:'在深夜的窗边听雨，独处，整理心情',scores:{erhu:3,guqin:2}},{label:'B',text:'和朋友彻夜长谈，聊人生聊理想',scores:{pipa:3,suona:3}},{label:'C',text:'独自一人背上行囊，去陌生的远方',scores:{dizi:3,guqin:2}},{label:'D',text:'宅在家里，看书、做饭、逗猫，享受慢时光',scores:{guzheng:3,guqin:2}}]},{id:2,text:'你在朋友眼里是一个什么样的人？',options:[{label:'A',text:'温柔体贴，总是能注意到别人的情绪',scores:{guzheng:3,erhu:2}},{label:'B',text:'有趣有料，有你在就不会冷场',scores:{suona:3,pipa:2}},{label:'C',text:'安静但有力量，关键时刻才显山露水',scores:{erhu:3,guqin:3}},{label:'D',text:'洒脱不羁，永远活得自由而洒脱',scores:{dizi:3,pipa:2}}]},{id:3,text:'你更喜欢什么样的音乐？',options:[{label:'A',text:'低回婉转的弦乐，能让人安静下来',scores:{erhu:3,guqin:3}},{label:'B',text:'节奏感强，前奏一响就心动',scores:{pipa:3,suona:3}},{label:'C',text:'空灵悠远的笛声，如同在山巅',scores:{dizi:3,guqin:2}},{label:'D',text:'古朴淡雅的琴音，洗涤心灵',scores:{guqin:3,guzheng:2}}]},{id:4,text:'以下哪种情境最让你心动？',options:[{label:'A',text:'夕阳下，一个人的散步，有琴声相伴',scores:{guqin:3,guzheng:2}},{label:'B',text:'突然收到消息：今晚老朋友聚会，走起！',scores:{suona:3,pipa:2}},{label:'C',text:'读到一句诗词，让自己沉默了半小时',scores:{erhu:3,guqin:2}},{label:'D',text:'在博物馆看到一件古琴，驻足良久',scores:{guqin:3,dizi:2}}]},{id:5,text:'你更向往什么样的情感？',options:[{label:'A',text:'细水长流，平平淡淡才是真',scores:{guzheng:3,erhu:2}},{label:'B',text:'轰轰烈烈，哪怕遍体鳞伤也要爱过',scores:{pipa:3,suona:2}},{label:'C',text:'心有灵犀，懂的人不言自明',scores:{guqin:3,erhu:2}},{label:'D',text:'自由相处，爱时不黏，不爱时不欠',scores:{dizi:3,pipa:2}}]},{id:6,text:'以下哪种描述最符合你？',options:[{label:'A',text:'不轻易求人，但帮起人来毫不含糊',scores:{guqin:3,dizi:2}},{label:'B',text:'朋友圈发得不多，但每条都是精华',scores:{erhu:3,guzheng:2}},{label:'C',text:'敢于表达，讨厌就是讨厌，喜欢就是喜欢',scores:{pipa:3,suona:2}},{label:'D',text:'社交达人，认识不认识都能聊上十分钟',scores:{suona:3,dizi:2}}]},{id:7,text:'面对压力时，你通常会？',options:[{label:'A',text:'写日记、听音乐，一个人消化',scores:{erhu:3,guqin:3}},{label:'B',text:'找朋友出来聊天，喝点小酒',scores:{pipa:3,suona:3}},{label:'C',text:'出去跑步或旅行，换个环境透口气',scores:{dizi:3,guqin:2}},{label:'D',text:'做家务、做饭，用忙碌转移注意力',scores:{guzheng:3,erhu:2}}]},{id:8,text:'以下哪种场合你最享受？',options:[{label:'A',text:'在窗边焚香弹琴，独自冥想',scores:{guqin:3,guzheng:2}},{label:'B',text:'过年回老家，和亲戚们热热闹闹',scores:{suona:3,pipa:2}},{label:'C',text:'在路边小馆独饮，看人间烟火',scores:{erhu:3,dizi:2}},{label:'D',text:'和朋友咖啡馆闲聊，交换彼此的秘密',scores:{pipa:3,guzheng:2}}]},{id:9,text:'听音乐时，你最在意的是什么？',options:[{label:'A',text:'旋律是否动听，能否触动内心',scores:{erhu:3,guqin:3}},{label:'B',text:'节奏是否带感，能否跟着摇头',scores:{pipa:3,suona:3}},{label:'C',text:'音色是否空灵，能否让人放空',scores:{dizi:3,guzheng:2}},{label:'D',text:'意境是否深远，值得反复回味',scores:{guqin:3,guzheng:2}}]},{id:10,text:'如果用一种乐器代表你，你会选？',options:[{label:'A',text:'二胡 —— 两根弦，演绎人间悲欢',scores:{erhu:3}},{label:'B',text:'琵琶 —— 文武双全，丰富多彩',scores:{pipa:3}},{label:'C',text:'古琴 —— 七弦之间，风雅无限',scores:{guqin:3}},{label:'D',text:'笛子 —— 悠扬自在，随性而为',scores:{dizi:3}},{label:'E',text:'古筝 —— 玉润清越，八方来人',scores:{guzheng:3}},{label:'F',text:'唢呐 —— 喜庆逼人，天地共鸣',scores:{suona:3}}]}];
var currentQ=0,scores={erhu:0,pipa:0,guqin:0,dizi:0,guzheng:0,suona:0};
function startQuiz(){document.body.classList.remove('on-home');showPage('quiz');renderQuestion()}
function goHome(){document.body.classList.add('on-home');showPage('home')}
function showPage(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById('page-'+id).classList.add('active')}
function renderQuestion(){var q=questions[currentQ],html='<div class="question-card" id="q'+q.id+'"><div class="question-text">'+q.text+'</div><div class="options-list">';q.options.forEach(function(o,i){html+='<button class="option-btn" onclick="selectOption('+q.id+','+i+')"><span class="option-label">'+o.label+'</span><span class="option-text">'+o.text+'</span></button>'});html+='</div></div>';document.getElementById('questionArea').innerHTML=html;document.getElementById('qCurrent').textContent=currentQ+1;document.getElementById('progressFill').style.width=(currentQ/questions.length*100)+'%'}
function selectOption(qid,optIdx){var q=questions.find(function(q){return q.id===qid});var opt=q.options[optIdx];Object.keys(opt.scores).forEach(function(inst){scores[inst]+=opt.scores[inst]});currentQ++;if(currentQ<questions.length){renderQuestion()}else{showResult()}}
function showResult(){var maxScore=0,winner='erhu';Object.keys(scores).forEach(function(inst){if(scores[inst]>maxScore){maxScore=scores[inst];winner=inst}});var inst=instruments[winner];var total=Object.values(scores).reduce(function(a,b){return a+b},0);var html='<div class="result-container"><div class="result-card"><div class="result-header" data-inst="'+inst.id+'"><div class="result-instrument-icon"><img src="'+inst.img+'" alt="'+inst.name+'"></div><div class="result-instrument-name">'+inst.name+'</div><div class="result-persona-title">'+inst.persona+'</div></div><div class="result-body"><div class="result-section"><div class="result-section-title">'+getDetailTitle(winner)+'</div><p>'+getDetailContent(winner)+'</p></div><div class="result-section"><div class="result-section-title">古韵诗词</div><p>'+getPoetry(winner)+'</p></div><div class="result-section"><div class="result-section-title">代表曲目</div><ul>'+getPieces(winner)+'</ul></div><div class="result-section"><div class="result-section-title">性格雷达</div>'+getHexChart(winner)+'<div style="margin-top:16px">'+getPercentBars(winner)+'</div></div><div class="result-section"><div class="result-section-title">知音古人</div><ul>'+getFigures(winner)+'</ul></div><div class="result-section"><div class="result-section-title">性格标签</div><div class="result-traits">'+getTraits(winner)+'</div></div>'+getCompatSection(winner)+'<div class="result-actions"><button class="btn-retry" onclick="retry()">重新测试</button><button class="btn-share" onclick="share()">分享结果</button></div></div></div></div>';document.getElementById('resultArea').innerHTML=html;document.body.classList.remove('on-home');showPage('result')}

function getDetailTitle(id){var t={erhu:'幽弦者的真实画像',pipa:'烈弦者的真实画像',guqin:'素弦者的真实画像',dizi:'清风者的真实画像',guzheng:'玉弦者的真实画像',suona:'金声者的真实画像'};return t[id]||''}

function getDetailContent(id){var c={erhu:'你有一种天赋——能够感知常人感知不到的情绪波动。别人看见一杯水，你看见的是水面折射出的所有光线。这种敏感性是你的超能力，也是你偶尔的负担。你不喜欢解释自己，因为在你能用语言描述之前，情绪已经发生、流动、消退了。朋友找你倾诉不是因为你能给方案，而是因为你能「懂」。这种懂，有时候比任何解决方案都管用。你在深夜里和自己对话。那些独处的时间不是孤独，是必要的充电。你的内心戏足够拍一部电影，但你不打算让任何人买票进场。你有一种温柔的力量——不说教，不强迫，只是在那里。但需要你的时候，你会发现自己的肩膀意外地可靠。在情感上，你是慢热型，但一旦投入，是那种把整颗心都放进去的方式。代价是，伤害也会更深。所以你学会了给自己留一点点退路。不是不信任，是学会了如何不让自己碎掉。',pipa:'你的人生没有「中间档」。要么全情投入，要么冷眼旁观，没有第三种选择。这种极致让你活得很烈，也让周围的人时常感到被你的热情灼伤。你讨厌虚伪。哪怕是善意的谎言，你也需要时间消化。在一个充斥fake nice的世界里，你的直接有时候是缺点，但更多时候是魅力。你对朋友是那种「两肋插刀」的类型——朋友有难，你会比当事人还急。你的朋友圈不大，但每一个都是过命的交情。你谈恋爱也是轰轰烈烈的。宁可遍体鳞伤，也不愿意将就平淡。这种态度让你受过伤，但也让你体验到了更深层的情感深度。你不是没有柔软的时候。只是你的柔软只会留给真正懂你的人。在那之前，你的刺是用来保护自己的铠甲。',guqin:'你是那种让周围人感到安心的存在——不急不躁，不争不抢。你的笃定不是来自无知，而是来自看过很多之后的选择。你知道自己想要什么，也知道自己可以放弃什么。你的内心是一座孤岛，但不是与世隔绝的那种孤岛——是有桥但你决定不开的那种。你的独处不是为了逃避社交，而是你需要那个独处来维持内心的秩序感。在决策上，你是深思熟虑型。一旦决定，几乎不会改变。这种稳定性有时候被误解为固执，但只有你自己知道，这是经过多少内心的权衡才得出的结论。你对「知音」的定义比任何人都苛刻。泛泛之交一大批，能走进你世界的人寥寥无几。但是一旦被你认定为同类，那是一种不需要解释的默契。你有一种能力——在混乱的环境中保持核心不变。无论外面多么喧嚣，你内心始终有一块是自己的净土。这是你的力量，也是你与生俱来的使命。',dizi:'你是那种让人「相处起来很舒服」的存在——不压迫，不黏人，不计较。你的自由不是刻意追求的结果，而是你本性如此，就像水往低处流一样自然。你不喜欢被关系绑架，哪怕是你在乎的人。你需要独立呼吸的空间，这是你的底线也是你的边界。所以在别人眼里你可能有些「不靠谱」，但那是你的生存策略。你有一种独特的幽默感——不是那种精心计算的搞笑，而是那种不经意间说出的话，却戳中了所有的笑点。你的有趣是随性的，不是表演的。你对世界有自己的一套解读方式，常常与主流不同。别人觉得你特立独行，只有你自己知道这只是因为你不想活成别人期待的样子。你的浪漫是骨子里的，不是那种送花送礼物的方式，而是一种存在本身的调调。你在的地方，空气里似乎都有一点点不同。',guzheng:'你是那种让人「如沐春风」的存在——和你在一起久了，会忘记原来世界还有其他温度。你把不舒服咽下去，把舒服留给别人。这种能力是你的天赋，也是你隐藏的代价。你有一种圆润的智慧——不是那种锋芒毕露的聪明，而是那种让人挑不出毛病的周到。你知道什么话该说什么话不该说，你知道什么时候该进什么时候该退。在关系中，你是付出型。常常把别人的需求放在前面，但不要以为你没有自己的底线——你只是选择了不轻易展示。这份隐忍是你的美德，也可能是你的弱点。你追求和谐，但和谐不等于没有冲突——而是你懂得如何把冲突化解成更深的理解。你有一种把矛盾变成黏合剂的能力，这是一种被低估的天赋。你是有温度的，但没有温度焦虑。你不需要持续被认可才能感到安全，你有自己的节奏和韵律。这是让你能够在各种环境中都活得不错的基础。',suona:'你是那种一出现整个房间能量就改变的人。你的存在本身就是一种声明——「我在这里」，不需要任何人认证。你是天生的聚光灯，哪怕在角落里，你也能成为焦点。你对生活的态度是「活着就要尽兴」。烦恼是用来解决的，不是用来发酵的。问题来了你想办法，实在没办法就想下次怎么避免。你很少在同一个地方跌倒两次——不是因为谨慎，是因为你的生活节奏太快，没时间在坑里待着。你的友情是热烈的、真诚的、不计回报的。你对朋友的态度是「有事你说」，然后真的会倾尽所能去帮。这种义气是你身上最耀眼的光环，也是你吸引人的地方。你不是一个细腻的人，至少表面上不是。但不要被这个骗了——你的内心其实很敏感。只是你选择了用热烈来保护那份敏感，不让任何人看见你的软肋。你的魅力来自于你对结果的在乎——不是那种精致的在乎，而是那种「管它呢先玩了再说」的豁达。这种态度让你活得很洒脱，也让你的生活充满了故事。'};return c[id]||''}

function getPoetry(id){var p={erhu:'白居易《琵琶行》虽写琵琶，但"弦弦掩抑声声思，似诉平生不得志"用在二胡上也极贴切。阿炳《二泉映月》——瞎子阿炳一生坎坷，将人世悲欢尽付两根琴弦，一曲之中有天地苍凉，也有不屈的风骨。',pipa:'白居易《琵琶行》"大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。"——千古名篇，将琵琶的丰富表现力写到了极致。琵琶自西域传入中原，本身就是文化交融的象征，热烈而多元。',guqin:'伯牙子期《高山流水》——琴为知音而弹，知音既去，摔琴绝弦。古琴文化中最动人的就是这种"士为知己者死"的精神。《诗经》"窈窕淑女，琴瑟友之"，琴也是君子修养的象征。',dizi:'李白《春夜洛城闻笛》"谁家玉笛暗飞声，散入春风满洛城。此夜曲中闻折柳，何人不起故园情。"笛声入春风，吹遍一座城——这就是笛子的穿透力和感染力。',guzheng:'李端《听筝》"鸣筝金粟柱，素手玉房前。欲得周郎顾，时时误拂弦。"——用筝声引心上人注意，含蓄又狡黠，这种温柔的心机正是古筝人格的精髓。筝音清越悠远，如月照秋水，不争不抢却自有一种光芒。',suona:'《宋史·五行志》记载"唢呐"来自波斯、龟兹一带，原是军乐之用，后传入民间。每一场乡村民间婚礼上，唢呐都是绝对主角——它是唯一一个能让全场人情不自禁起舞的中国乐器。'};return p[id]||''}

function getPieces(id){var pcs={erhu:'<li>《二泉映月》</li><li>《江河水》</li><li>《赛马》</li>',pipa:'<li>《十面埋伏》</li><li>《霸王卸甲》</li><li>《春江花月夜》</li>',guqin:'<li>《高山流水》</li><li>《广陵散》</li><li>《平沙落雁》</li>',dizi:'<li>《姑苏行》</li><li>《鹧鸪飞》</li><li>《扬鞭催马运粮忙》</li>',guzheng:'<li>《渔舟唱晚》</li><li>《高山流水》</li><li>《战台风》</li>',suona:'<li>《百鸟朝凤》</li><li>《抬花轿》</li><li>《喜庆》</li>'};return pcs[id]||''}

function getFigures(id){var figs={erhu:'<li>李清照 — 深情婉约，晚景凄凉却风骨犹存</li><li>杜甫 — 心怀苍生，沉郁顿挫</li>',pipa:'<li>李白 — 豪放不羁，诗酒趁年华</li><li>苏轼 — 大起大落，永远热爱生活</li>',guqin:'<li>陶渊明 — 归隐田园，不为五斗米折腰</li><li>嵇康 — 刑场上弹完《广陵散》，从容赴死</li>',dizi:'<li>李白 — 一生好入名山游，千金散尽还复来</li><li>唐伯虎 — 别人笑我太疯癫，我笑他人看不穿</li>',guzheng:'<li>王昭君 — 柔中有刚，以一身系两国和平</li><li>上官婉儿 — 才冠巾帼，政坛风云</li>',suona:'<li>鲁智深 — 倒拔垂杨柳，花和尚大闹野猪林</li><li>张飞 — 粗中有细，百万军中取上将首级</li>'};return figs[id]||''}

function getTraits(id){var tr={erhu:'<span class="trait-tag">敏感细腻</span><span class="trait-tag">情深不寿</span><span class="trait-tag">内敛深沉</span><span class="trait-tag">善于倾听</span>',pipa:'<span class="trait-tag">敢爱敢恨</span><span class="trait-tag">情绪饱满</span><span class="trait-tag">热烈奔放</span><span class="trait-tag">不藏不掖</span>',guqin:'<span class="trait-tag">清雅通透</span><span class="trait-tag">内心笃定</span><span class="trait-tag">享受孤独</span><span class="trait-tag">独立思考</span>',dizi:'<span class="trait-tag">自由洒脱</span><span class="trait-tag">浪漫气质</span><span class="trait-tag">不喜束缚</span><span class="trait-tag">随性而行</span>',guzheng:'<span class="trait-tag">温润如玉</span><span class="trait-tag">处世得体</span><span class="trait-tag">外柔内刚</span><span class="trait-tag">追求和谐</span>',suona:'<span class="trait-tag">热血热肠</span><span class="trait-tag">不拘小节</span><span class="trait-tag">感染力强</span><span class="trait-tag">聚光灯</span>'};return tr[id]||''}

function getCompatibility(id){var compat={erhu:{best:'guqin',worst:'suona',bestName:'古琴',worstName:'唢呐',bestR:'古琴的知音意境与二胡的深情最是契合，一个懂沉默，一个善倾听，是最高级的陪伴。',worstR:'唢呐的热烈有时会让二胡感到喧闹，热闹是他们的，二胡只想一个人静静听风雨。'},pipa:{best:'suona',worst:'guqin',bestName:'唢呐',worstName:'古琴',bestR:'琵琶与唢呐都是热烈之人，聚会中彼此懂得制造高潮，互相成就全场最佳气氛。',worstR:'古琴太静了，琵琶的热情在古琴那里常常得到沉默回应，时间久了会觉得自己在独角戏。'},guqin:{best:'dizi',worst:'pipa',bestName:'笛子',worstName:'琵琶',bestR:'古琴与笛子都是隐士之音，山高水长，一个在山巅吹笛，一个在林间抚琴，精神上门当户对。',worstR:'琵琶需要被看见，古琴不需要被看见。两种截然不同的存在方式，相处久了会彼此消耗。'},dizi:{best:'guqin',worst:'guzheng',bestName:'古琴',worstName:'古筝',bestR:'笛子与古琴是精神贵族的组合，一个不羁，一个通透，彼此给予空间却不失默契。',worstR:'古筝的"好好相处"哲学有时会让追求自由的笛子感到窒息——太圆滑了，少了那股清风。'},guzheng:{best:'erhu',worst:'dizi',bestName:'二胡',worstName:'笛子',bestR:'古筝的温润与二胡的深情彼此欣赏，彼此给对方留余地，是最舒服的长久相处模式。',worstR:'笛子的自由散漫有时会让追求和谐的的古筝感到不安——他们需要可预期的关系节奏。'},suona:{best:'pipa',worst:'erhu',bestName:'琵琶',worstName:'二胡',bestR:'唢呐和琵琶都是不吝啬表达的人，热闹在一起时谁也不欠谁，是天生派对搭档。',worstR:'二胡需要安静和深度理解，唢呐需要观众和欢呼——需求错位，相处久了两边都委屈。'}};return compat[id]||{}}

var dimDefs=[{name:'内省深度',max:15,base:{erhu:10,guqin:8,guzheng:6,dizi:6,pipa:5,suona:3}},{name:'社交活跃',max:15,base:{suona:12,pipa:10,guzheng:7,dizi:5,erhu:4,guqin:3}},{name:'审美维度',max:15,base:{guqin:12,dizi:10,guzheng:8,erhu:6,pipa:5,suona:3}},{name:'情感浓度',max:15,base:{erhu:12,pipa:10,guzheng:7,suona:6,guqin:5,dizi:3}},{name:'自由倾向',max:15,base:{dizi:12,guqin:10,pipa:7,suona:6,guzheng:4,erhu:3}},{name:'笃定程度',max:15,base:{guqin:12,guzheng:10,erhu:8,pipa:6,suona:4,dizi:3}}];

function getPercentBars(winId){
  var bars='';
  dimDefs.forEach(function(d){
    var val=d.base[winId]||0;
    var pct=Math.round(val/d.max*100);
    bars+='<div class="percent-row"><div class="percent-label">'+d.name+'</div><div class="percent-bar-track"><div class="percent-bar-fill" style="width:'+pct+'%;background:'+instruments[winId].color+'"></div></div><div class="percent-value">'+pct+'%</div></div>';
  });
  return'<div class="percent-chart">'+bars+'</div>';
}

function getHexChart(winId){
  var n=dimDefs.length,R=88,cx=140,cy=130;
  var pts=dimDefs.map(function(d,i){
    var val=d.base[winId]||0;
    var ratio=Math.min(val/d.max,1);
    var angle=Math.PI*2*i/n-Math.PI/2;
    return{cx:cx+R*ratio*Math.cos(angle),cy:cy+R*ratio*Math.sin(angle),label:d.name,val:val,max:d.max,angle:angle};
  });
  var axisLines=pts.map(function(p,i){
    return'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+92*Math.cos(p.angle))+'" y2="'+(cy+92*Math.sin(p.angle))+'" stroke="#c8c0b0" stroke-width="0.8" stroke-dasharray="2,2"/>';
  }).join('');
  var gridRings=[0.33,0.66,1];
  var gridLines=gridRings.map(function(r){
    var pstr=pts.map(function(p){return(cx+r*R*Math.cos(p.angle))+','+(cy+r*R*Math.sin(p.angle))}).join(' ');
    return'<polygon points="'+pstr+'" fill="none" stroke="#d0c8b8" stroke-width="0.6"/>';
  }).join('');
  var polyFill=pts.map(function(p){return p.cx+','+p.cy}).join(' ');
  var poly='<polygon points="'+polyFill+'" fill="rgba(80,100,120,0.08)" stroke="rgba(80,100,120,0.35)" stroke-width="1.2"/>';
  var labels=pts.map(function(p,i){
    var lx=cx+(106)*Math.cos(p.angle),ly=cy+(106)*Math.sin(p.angle);
    var pct=Math.round(p.val/p.max*100);
    return'<text class="hex-label" x="'+lx+'" y="'+ly+'" dy="0.3em">'+p.label+'</text><circle cx="'+p.cx+'" cy="'+p.cy+'" r="2.5" fill="rgba(60,80,100,0.5)"/>';
  }).join('');
  return'<div class="hexagon-chart-wrap"><svg viewBox="0 0 280 260" style="overflow:visible">'+gridLines+axisLines+poly+labels+'</svg></div>';
}

function getCompatSection(winId){
  var c=getCompatibility(winId);
  return'<div class="compat-section"><div class="result-section-title">乐见知音</div><div class="compat-grid"><div class="compat-card compat-best"><div class="compat-badge">最合拍</div><div class="compat-instrument">'+c.bestName+'</div><div class="compat-reason">'+c.bestR+'</div></div><div class="compat-card compat-worst"><div class="compat-badge">需注意</div><div class="compat-instrument">'+c.worstName+'</div><div class="compat-reason">'+c.worstR+'</div></div></div></div>';
}

function showResult(){var maxScore=0,winner='erhu';Object.keys(scores).forEach(function(inst){if(scores[inst]>maxScore){maxScore=scores[inst];winner=inst}});var inst=instruments[winner];var total=Object.values(scores).reduce(function(a,b){return a+b},0);var html='<div class="result-container"><div class="result-card"><div class="result-header" data-inst="'+inst.id+'"><div class="result-instrument-icon"><img src="'+inst.img+'" alt="'+inst.name+'"></div><div class="result-instrument-name">'+inst.name+'</div><div class="result-persona-title">'+inst.persona+'</div></div><div class="result-body"><div class="result-section"><div class="result-section-title">'+getDetailTitle(winner)+'</div><p>'+getDetailContent(winner)+'</p></div><div class="result-section"><div class="result-section-title">古韵诗词</div><p>'+getPoetry(winner)+'</p></div><div class="result-section"><div class="result-section-title">代表曲目</div><ul>'+getPieces(winner)+'</ul></div><div class="result-section"><div class="result-section-title">性格雷达</div><div class="hexagon-section">'+getHexChart(winner)+'</div><div style="margin-top:16px">'+getPercentBars(winner)+'</div></div><div class="result-section"><div class="result-section-title">知音古人</div><ul>'+getFigures(winner)+'</ul></div><div class="result-section"><div class="result-section-title">性格标签</div><div class="result-traits">'+getTraits(winner)+'</div></div>'+getCompatSection(winner)+'<div class="result-actions"><button class="btn-retry" onclick="retry()">重新测试</button><button class="btn-share" onclick="share()">分享结果</button></div></div></div></div>';document.getElementById('resultArea').innerHTML=html;document.body.classList.remove('on-home');showPage('result')}

function retry(){scores={erhu:0,pipa:0,guqin:0,dizi:0,guzheng:0,suona:0};currentQ=0;showPage('home');document.body.classList.add('on-home')}
function share(){var winId=Object.keys(scores).reduce(function(a,b){return scores[a]>scores[b]?a:b});var instName=instruments[winId].name;var text='我在弦外之音测试中是【'+instName+'】，快来测测你是哪种乐器吧！';if(navigator.share){navigator.share({title:'弦外之音',text:text})}else{navigator.clipboard.writeText(text).then(function(){alert('结果已复制到剪贴板！')})}}
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('on-home');setTimeout(function(){document.querySelectorAll('.token').forEach(function(t){t.classList.add('visible')})},300)});

</script>
